# Chart release workflow — the single source of truth for packaging and pushing
# the Helm chart to GHCR OCI.
#
# Triggered in two ways:
#   1. workflow_run: automatically when a service release workflow (Release - Frontend,
#      Release - Backend, Release - Scraper) completes successfully. The service workflow
#      has already bumped Chart.yaml and values.yaml on main before finishing, so this
#      workflow just reads the version from Chart.yaml and packages the chart.
#      (Using workflow_run instead of a helm-v* tag push avoids the GitHub limitation
#      where GITHUB_TOKEN-authenticated tag pushes cannot trigger downstream workflows.)
#   2. push: tags helm-v* — for manual chart-only releases when only Helm templates or
#      values change with no associated service image rebuild.
#
# In both cases the workflow reads Chart.yaml from main, optionally sets the version
# (manual tag path), commits it back if needed, packages the chart, and pushes to GHCR.

name: Release - Helm chart

on:
  workflow_run:
    workflows:
      - "Release - Frontend"
      - "Release - Backend"
      - "Release - Scraper"
    types:
      - completed
  push:
    tags:
      - "helm-v*"

env:
  REGISTRY: ghcr.io
  CHART_PATH: helm/recipes

permissions:
  contents: write
  packages: write

concurrency:
  group: helm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # For workflow_run events: only proceed when the triggering workflow succeeded.
    # For push (manual helm-v* tag): always proceed.
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Manual helm-v* tag push: extract version from the tag name
            VERSION="${GITHUB_REF_NAME#helm-v}"
          else
            # Triggered by a service release workflow: the service workflow already
            # bumped Chart.yaml on main, so read the version from there.
            git fetch origin main
            git checkout -f main
            VERSION=$(yq '.version' "${{ env.CHART_PATH }}/Chart.yaml")
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Lowercase registry paths
        id: registry
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Update Chart.yaml version and update changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f main

          VERSION="${{ steps.version.outputs.version }}"
          yq -i ".version = \"${VERSION}\"" "${{ env.CHART_PATH }}/Chart.yaml"

          node scripts/update-changelog.mjs "helm-v${VERSION}"

          git add "${{ env.CHART_PATH }}/Chart.yaml" CHANGELOG.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(helm): release chart v${VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Package and push Helm chart
        run: |
          git checkout -f main
          git pull origin main
          VERSION=$(yq '.version' "${{ env.CHART_PATH }}/Chart.yaml")
          helm package "${{ env.CHART_PATH }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" --password-stdin
          # Skip push if this version already exists (handles duplicate workflow_run triggers
          # when two service releases complete close together and both queue a helm run).
          if helm show chart "oci://${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/charts/recipes" \
              --version "${VERSION}" >/dev/null 2>&1; then
            echo "Chart version ${VERSION} already exists in registry — skipping push."
            exit 0
          fi
          helm push "recipes-${VERSION}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/charts"
