# Chart-only release workflow.
# Triggered on tags matching helm-v* (e.g. helm-v1.2.3).
# Use this when only Helm templates or values change (no service image rebuild needed).
# Packages and pushes the unified helm/recipes chart to GHCR at the exact version
# specified in the tag — no automatic patch bump (caller sets the version explicitly).

name: Release - Helm chart

on:
  push:
    tags:
      - "helm-v*"

env:
  REGISTRY: ghcr.io
  CHART_PATH: helm/recipes

permissions:
  contents: write
  packages: write

concurrency:
  group: helm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#helm-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Lowercase registry paths
        id: registry
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update Chart.yaml version and update changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f main

          VERSION="${{ steps.version.outputs.version }}"
          yq -i ".version = \"${VERSION}\"" "${{ env.CHART_PATH }}/Chart.yaml"

          node scripts/update-changelog.mjs "helm-v${VERSION}"

          git add "${{ env.CHART_PATH }}/Chart.yaml" CHANGELOG.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(helm): release chart v${VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Package and push Helm chart
        run: |
          git checkout -f main
          git pull origin main
          VERSION=$(yq '.version' "${{ env.CHART_PATH }}/Chart.yaml")
          helm package "${{ env.CHART_PATH }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" --password-stdin
          helm push "recipes-${VERSION}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/charts"
