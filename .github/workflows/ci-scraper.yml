# CI for the scraper service (Node.js/TypeScript).
# Triggered only when files under scraper/ change.

name: CI — Scraper

on:
  push:
    branches: [main]
    paths:
      - "scraper/**"
  pull_request:
    branches: [main]
    paths:
      - "scraper/**"

concurrency:
  group: ci-scraper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm run test:ci

      - name: TypeScript build
        run: npm run build
