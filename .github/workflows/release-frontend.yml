# Release workflow for the frontend.
# Triggered on tags matching frontend-v* (e.g. frontend-v1.2.3).
# Builds and pushes the container image to GHCR, then packages and pushes the Helm chart.

name: Release — Frontend

on:
  push:
    tags:
      - "frontend-v*"

env:
  REGISTRY: ghcr.io
  CHART_PATH: helm/recipes-frontend

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#frontend-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Lowercase registry paths
        id: registry
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recipes-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.registry.outputs.image }}:${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=${{ steps.registry.outputs.image }}:cache
          cache-to: type=registry,ref=${{ steps.registry.outputs.image }}:cache,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update Chart.yaml versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          yq -i ".version = \"${VERSION}\"" "${{ env.CHART_PATH }}/Chart.yaml"
          yq -i ".appVersion = \"${VERSION}\"" "${{ env.CHART_PATH }}/Chart.yaml"

      - name: Package and push Helm chart
        run: |
          helm package "${{ env.CHART_PATH }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" --password-stdin
          helm push recipes-frontend-${{ steps.version.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/charts

      - name: Commit Chart.yaml and CHANGELOG.md to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f main
          VERSION="${{ steps.version.outputs.version }}"
          yq -i ".version = \"${VERSION}\"" "${{ env.CHART_PATH }}/Chart.yaml"
          yq -i ".appVersion = \"${VERSION}\"" "${{ env.CHART_PATH }}/Chart.yaml"
          node scripts/update-changelog.mjs "frontend-v${VERSION}"
          git add "${{ env.CHART_PATH }}/Chart.yaml" CHANGELOG.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: bump frontend chart and update changelog for v${VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin main
