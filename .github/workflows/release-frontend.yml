# Release workflow for the frontend service.
# Triggered on tags matching frontend-v* (e.g. frontend-v1.2.3).
# Builds and pushes the frontend container image to GHCR, then updates the
# unified helm/recipes chart (image tag + patch version bump) and creates a
# helm-v* tag to trigger the chart release workflow.

name: Release - Frontend

on:
  push:
    tags:
      - "frontend-v*"

env:
  REGISTRY: ghcr.io
  CHART_PATH: helm/recipes

permissions:
  contents: write
  packages: write

concurrency:
  group: helm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#frontend-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Lowercase registry paths
        id: registry
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recipes-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.registry.outputs.image }}:${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=${{ steps.registry.outputs.image }}:cache
          cache-to: type=registry,ref=${{ steps.registry.outputs.image }}:cache,mode=max

      - name: Update chart image tag, bump chart version, and tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f main

          VERSION="${{ steps.version.outputs.version }}"
          CURRENT_IMAGE_TAG=$(yq '.frontend.image.tag' "${{ env.CHART_PATH }}/values.yaml")

          # Skip if this image tag is already recorded (idempotent retry safety)
          if [ "${CURRENT_IMAGE_TAG}" = "${VERSION}" ]; then
            echo "Image tag already set to ${VERSION}, checking for existing helm tag..."
            CURRENT_CHART=$(yq '.version' "${{ env.CHART_PATH }}/Chart.yaml")
            if git ls-remote --tags origin "refs/tags/helm-v${CURRENT_CHART}" | grep -q .; then
              echo "helm-v${CURRENT_CHART} already exists on remote, nothing to do."
              exit 0
            fi
            # Tag exists in chart but not yet pushed — push the tag to trigger chart release
            git tag "helm-v${CURRENT_CHART}" || true
            git push origin "helm-v${CURRENT_CHART}"
            exit 0
          fi

          # Update the frontend image tag in values.yaml
          yq -i ".frontend.image.tag = \"${VERSION}\"" "${{ env.CHART_PATH }}/values.yaml"

          # Patch-bump the chart version (e.g. 1.2.3 -> 1.2.4)
          CURRENT_CHART=$(yq '.version' "${{ env.CHART_PATH }}/Chart.yaml")
          NEW_CHART=$(echo "${CURRENT_CHART}" | awk -F. '{printf "%s.%s.%s", $1, $2, $3+1}')
          yq -i ".version = \"${NEW_CHART}\"" "${{ env.CHART_PATH }}/Chart.yaml"

          node scripts/update-changelog.mjs "frontend-v${VERSION}"

          git add "${{ env.CHART_PATH }}/values.yaml" "${{ env.CHART_PATH }}/Chart.yaml" CHANGELOG.md
          git commit -m "chore(helm): bump frontend image to ${VERSION}, chart to ${NEW_CHART} [skip ci]"
          git pull --rebase origin main
          git push origin main

          # Create and push the helm-v* tag — this triggers release-helm.yml to package
          # and push the chart to GHCR, keeping chart packaging logic in one place.
          git tag "helm-v${NEW_CHART}"
          git push origin "helm-v${NEW_CHART}"
