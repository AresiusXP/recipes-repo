# Release workflow for the frontend service.
# Triggered on tags matching frontend-v* (e.g. frontend-v1.2.3).
# Builds and pushes the frontend container image to GHCR, then updates the
# unified helm/recipes chart (image tag + patch version bump) and releases it.

name: Release - Frontend

on:
  push:
    tags:
      - "frontend-v*"

env:
  REGISTRY: ghcr.io
  CHART_PATH: helm/recipes

permissions:
  contents: write
  packages: write

concurrency:
  group: helm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#frontend-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Lowercase registry paths
        id: registry
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recipes-frontend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.registry.outputs.image }}:${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=${{ steps.registry.outputs.image }}:cache
          cache-to: type=registry,ref=${{ steps.registry.outputs.image }}:cache,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update chart — image tag and bump chart version
        id: chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -f main

          VERSION="${{ steps.version.outputs.version }}"

          # Update the frontend image tag in values.yaml
          yq -i ".frontend.image.tag = \"${VERSION}\"" "${{ env.CHART_PATH }}/values.yaml"

          # Patch-bump the chart version (e.g. 1.2.3 -> 1.2.4)
          CURRENT_CHART=$(yq '.version' "${{ env.CHART_PATH }}/Chart.yaml")
          NEW_CHART=$(echo "${CURRENT_CHART}" | awk -F. '{printf "%s.%s.%s", $1, $2, $3+1}')
          yq -i ".version = \"${NEW_CHART}\"" "${{ env.CHART_PATH }}/Chart.yaml"
          echo "chart_version=${NEW_CHART}" >> "$GITHUB_OUTPUT"

          node scripts/update-changelog.mjs "frontend-v${VERSION}"

          git add "${{ env.CHART_PATH }}/values.yaml" "${{ env.CHART_PATH }}/Chart.yaml" CHANGELOG.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(helm): bump frontend image to ${VERSION}, chart to ${NEW_CHART} [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Package and push Helm chart
        run: |
          # Re-checkout main and pull to get the committed Chart.yaml with the bumped version.
          # Re-read the version from Chart.yaml rather than using the step output to avoid
          # stale version if another release committed a further bump before this step ran.
          git checkout -f main
          git pull origin main
          CHART_VERSION=$(yq '.version' "${{ env.CHART_PATH }}/Chart.yaml")
          helm package "${{ env.CHART_PATH }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" --password-stdin
          helm push "recipes-${CHART_VERSION}.tgz" \
            "oci://${{ env.REGISTRY }}/${{ steps.registry.outputs.owner }}/charts"
