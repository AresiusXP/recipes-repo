# Default values for recipes-backend

replicaCount: 1

image:
  repository: ghcr.io/aresiusxp/recipes-backend
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  # URL of the scraper service (internal ClusterIP)
  scraperUrl: "http://recipes-scraper:3001"
  # Directory where media files are stored (must match the PVC mount path)
  mediaDir: "/media"
  # Gemini model name
  geminiModel: "gemini-2.0-flash"
  # Structured log level
  logLevel: "info"
  # Port the Go server listens on
  port: "8080"

# Secret references — must exist in the cluster before deploying.
# Create with:
#   kubectl create secret generic recipes-backend-secrets \
#     --from-literal=auth-secret='<same-as-frontend>' \
#     --from-literal=database-url='postgresql://user:pass@postgres-host:5432/recipes' \
#     --from-literal=gemini-api-key='<your-gemini-key>' \
#     --from-literal=backend-internal-secret='<random-secret-shared-with-frontend>'
secrets:
  existingSecret: "recipes-backend-secrets"
  keys:
    authSecret: "auth-secret"
    databaseUrl: "database-url"
    geminiApiKey: "gemini-api-key"
    backendInternalSecret: "backend-internal-secret"

service:
  type: ClusterIP
  port: 8080

# Media persistent volume claim
mediaPvc:
  enabled: true
  storageClassName: ""
  size: 5Gi
  accessMode: ReadWriteOnce
  # Set to an existing PVC name to reuse (e.g. migrated from the old frontend chart)
  existingClaim: ""

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 20
  readiness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

dnsConfig:
  options:
    - name: ndots
      value: "1"
