# Default values for recipes-frontend

replicaCount: 1

image:
  repository: ghcr.io/aresiusxp/recipes-frontend
  pullPolicy: IfNotPresent
  # Defaults to Chart.appVersion when left empty
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Application environment configuration
config:
  # Comma-separated list of email addresses allowed to register.
  # Existing users can always sign in regardless of this setting.
  # Leave empty to allow anyone to register (open registration).
  # E.g. "alice@example.com,bob@example.com"
  allowedEmails: ""
  # Base URL for OAuth callbacks (must match your ingress hostname).
  # Sets both NEXTAUTH_URL and AUTH_URL for Auth.js v5 compatibility.
  # AUTH_TRUST_HOST is always set to "true" to support reverse-proxy deployments.
  nextauthUrl: "https://recipes.example.com"
  # URL of the backend API service (internal Kubernetes ClusterIP service)
  backendUrl: "http://recipes-backend:8080"
  # Structured log level emitted to stdout (trace | debug | info | warn | error | fatal)
  logLevel: "info"
  # Application name embedded in every log line (useful for multi-app Loki setups)
  appName: "recipes-frontend"
  # Microsoft Entra ID issuer — controls which Microsoft accounts may log in.
  # Defaults to "common" (personal + work/school) when left empty.
  microsoftEntraIdIssuer: "https://login.microsoftonline.com/common/v2.0"

# Secret references — these must exist in the cluster
# Create them with:
#   kubectl create secret generic recipes-frontend-secrets \
#     --from-literal=auth-secret='<random-secret>' \
#     --from-literal=google-client-id='<your-id>' \
#     --from-literal=google-client-secret='<your-secret>'
#
# To also enable Microsoft login, add:
#     --from-literal=microsoft-entra-id-client-id='<your-entra-client-id>' \
#     --from-literal=microsoft-entra-id-client-secret='<your-entra-client-secret>'
secrets:
  # Name of the Kubernetes Secret containing app credentials
  existingSecret: "recipes-frontend-secrets"
  keys:
    authSecret: "auth-secret"
    googleClientId: "google-client-id"
    googleClientSecret: "google-client-secret"
    # Set these to enable Microsoft Entra ID (Azure AD) login.
    # Leave empty ("") to disable Microsoft login entirely.
    microsoftEntraIdClientId: ""
    microsoftEntraIdClientSecret: ""

# config.microsoftEntraIdIssuer controls which Microsoft accounts may log in:
#   https://login.microsoftonline.com/common/v2.0      — personal + work/school (default)
#   https://login.microsoftonline.com/consumers/v2.0   — personal accounts only
#   https://login.microsoftonline.com/organizations/v2.0 — work/school only
#   https://login.microsoftonline.com/<tenant-id>/v2.0 — single tenant

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: recipes.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: recipes-tls
  #    hosts:
  #      - recipes.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Liveness and readiness probes
probes:
  liveness:
    httpGet:
      path: /login
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    httpGet:
      path: /login
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

dnsConfig:
  options:
    - name: ndots
      value: "1"
