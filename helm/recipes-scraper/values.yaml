# Default values for recipes-scraper

replicaCount: 1

image:
  repository: ghcr.io/aresiusxp/recipes-scraper
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  port: "3001"
  logLevel: "info"
  # Chromium executable path inside the container
  playwrightExecutablePath: "/usr/bin/chromium"

service:
  type: ClusterIP
  port: 3001

# Scraper is stateless — no PVC needed.

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

dnsConfig:
  options:
    - name: ndots
      value: "1"
