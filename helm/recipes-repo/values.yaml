# Default values for recipes-repo

replicaCount: 1

image:
  repository: ghcr.io/aresiusxp/recipes-repo
  pullPolicy: IfNotPresent
  # Defaults to Chart.appVersion when left empty
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Application environment configuration
config:
  # Base URL for OAuth callbacks (must match your ingress hostname).
  # Sets both NEXTAUTH_URL and AUTH_URL for Auth.js v5 compatibility.
  # AUTH_TRUST_HOST is always set to "true" to support reverse-proxy deployments.
  nextauthUrl: "https://recipes.example.com"
  # Directory for recipe images inside the container
  mediaDir: "public/media"
  # SQLite database path inside the container
  databaseUrl: "file:/app/data/recipes.db"
  # Gemini model to use for recipe extraction
  geminiModel: "gemini-2.0-flash"

# Secret references — these must exist in the cluster
# Create them with:
#   kubectl create secret generic recipes-repo-secrets \
#     --from-literal=auth-secret='<random-secret>' \
#     --from-literal=google-client-id='<your-id>' \
#     --from-literal=google-client-secret='<your-secret>' \
#     --from-literal=gemini-api-key='<your-key>'
secrets:
  # Name of the Kubernetes Secret containing app credentials
  existingSecret: "recipes-repo-secrets"
  keys:
    authSecret: "auth-secret"
    googleClientId: "google-client-id"
    googleClientSecret: "google-client-secret"
    geminiApiKey: "gemini-api-key"

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: recipes.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: recipes-tls
  #    hosts:
  #      - recipes.example.com

# Persistent storage for SQLite database and recipe images
persistence:
  data:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    # existingClaim: ""
  media:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    # existingClaim: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Liveness and readiness probes
probes:
  liveness:
    httpGet:
      path: /login
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    httpGet:
      path: /login
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

dnsConfig:
  options:
    - name: ndots
      value: "1"
