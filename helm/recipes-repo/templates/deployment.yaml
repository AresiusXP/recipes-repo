apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "recipes-repo.fullname" . }}
  labels:
    {{- include "recipes-repo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "recipes-repo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "recipes-repo.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      initContainers:
        - name: db-push
          image: "{{ .Values.migrator.image.repository }}:{{ .Values.migrator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.migrator.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: {{ .Values.config.databaseUrl | quote }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: {{ .Values.config.databaseUrl | quote }}
            - name: MEDIA_DIR
              value: {{ .Values.config.mediaDir | quote }}
            - name: NEXTAUTH_URL
              value: {{ .Values.config.nextauthUrl | quote }}
            - name: AUTH_URL
              value: {{ .Values.config.nextauthUrl | quote }}
            - name: ALLOWED_EMAILS
              value: {{ .Values.config.allowedEmails | quote }}
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.authSecret }}
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.googleClientId }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.googleClientSecret }}
            {{- if .Values.secrets.keys.microsoftEntraIdClientId }}
            - name: MICROSOFT_ENTRA_ID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.microsoftEntraIdClientId }}
            - name: MICROSOFT_ENTRA_ID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.microsoftEntraIdClientSecret }}
            - name: MICROSOFT_ENTRA_ID_ISSUER
              value: {{ .Values.config.microsoftEntraIdIssuer | default "https://login.microsoftonline.com/common/v2.0" | quote }}
            {{- end }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: {{ .Values.secrets.keys.geminiApiKey }}
            - name: GEMINI_MODEL
              value: {{ .Values.config.geminiModel | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | default "info" | quote }}
            - name: APP_NAME
              value: {{ .Values.config.appName | default "recipes-repo" | quote }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            {{- if .Values.persistence.media.enabled }}
            - name: media
              mountPath: /app/media
            {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "recipes-repo.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.persistence.media.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "recipes-repo.fullname" . }}-media
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
